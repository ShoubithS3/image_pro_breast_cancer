[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mammo-lens"
version = "0.1.0"
description = "Reproducible mammogram classification and reliability experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "Pillow>=11,<13",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "streamlit>=1.42,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
train = ["torch==2.6.0", "torchvision==0.21.0"]

[project.scripts]
mammo-lens = "mammo_lens.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["mammo_lens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
