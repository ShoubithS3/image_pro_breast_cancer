name: Verify MAMMO-LENS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --locked --all-extras --python 3.12
      - run: uv run --all-extras python -m pytest -q
      - name: Validate frontend JavaScript
        run: node --check frontend/app.js
